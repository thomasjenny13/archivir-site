<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivir — modélisation BIM &amp; 3D</title>
<meta name="description" content="Archivir modélise vos relevés, scans et plans existants en maquettes BIM 3D pour architectes. Site en préparation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>

<main class="splash">
  <p class="eyebrow">Modélisation BIM &amp; 3D</p>
  <model-viewer
    class="hero-model"
    src="pavillon.glb"
    alt="Maquette 3D du pavillon modélisé par Archivir"
    camera-controls
    disable-pan
    disable-zoom
    auto-rotate
    rotation-per-second="18deg"
    interaction-prompt="none"
    shadow-intensity="0"
    exposure="1.1"
    camera-orbit="25deg 75deg auto"
  ></model-viewer>
  <h1 class="wordmark">ARCHIVIR</h1>
  <div class="rule"></div>
  <p class="tagline">L'existant, remodélisé en volume.</p>
  <p class="status">Nouveau site en préparation.</p>
  <a class="contact-link placeholder" href="#">votre-email@archivir.ch</a>
</main>

<footer>
  <span>Archivir</span>
  <span class="placeholder">En construction</span>
</footer>

</body>
</html>
