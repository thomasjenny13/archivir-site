<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme = localStorage.getItem('archivir-theme') || 'light';</script>
<title>Tupi — Archivir</title>
<meta name="description" content="Maquette 3D du projet Tupi, concours d'architecture pour l'Hôpital du Valais, par mijong architecture.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<a class="back-link" href="../index.html">← Retour</a>
<button id="theme-toggle" class="theme-toggle theme-toggle--viewer" aria-label="Basculer le thème">☾</button>
<a id="nav-prev" class="nav-arrow nav-arrow-left" href="#" aria-label="Projet précédent">←</a>
<a id="nav-next" class="nav-arrow nav-arrow-right" href="#" aria-label="Projet suivant">→</a>

<main class="viewer-page">
  <div id="viewer-canvas" class="full-model model-transition-in"></div>

  <nav class="compass" aria-label="Vues préréglées">
    <div class="compass-ring"></div>
    <button class="compass-pt compass-n" data-view="north" aria-label="Vue nord">N</button>
    <button class="compass-pt compass-e" data-view="east" aria-label="Vue est">E</button>
    <button class="compass-pt compass-s" data-view="south" aria-label="Vue sud">S</button>
    <button class="compass-pt compass-o" data-view="west" aria-label="Vue ouest">O</button>
  </nav>

  <button id="cut-toggle" class="cut-fab" aria-label="Vue en coupe">◐</button>

  <div class="material-picker" aria-label="Matériaux">
    <button class="swatch" data-preset="platre" style="background:#9E9689" aria-label="Plâtre"></button>
    <button class="swatch" data-preset="beton" style="background:#6B6B68" aria-label="Béton"></button>
    <button class="swatch" data-preset="blanc" style="background:#D9D7CE" aria-label="Blanc architecture"></button>
    <button class="swatch" data-preset="terre" style="background:#8C6152" aria-label="Terre cuite"></button>
    <button class="swatch" data-preset="bronze" style="background:#59492E" aria-label="Bronze"></button>
  </div>

  <p class="viewer-credit"><a class="credit-link" href="https://www.mijong.ch/projects/tupi-sion/" target="_blank" rel="noopener noreferrer"><strong>Tupi</strong></a>mijong architecture<br><span class="credit-meta">2019 · Sion · Santé · Concours</span></p>
</main>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  function applyThemeIcon(){
    themeToggle.textContent = document.documentElement.dataset.theme === 'light' ? '☾' : '☀';
  }
  applyThemeIcon();
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('archivir-theme', next);
    applyThemeIcon();
  });

  // project switcher — pavillon now lives in its own subfolder
  document.getElementById('nav-prev').href = 'pavillon cueno_aldo rossi/pavillon.html';
  document.getElementById('nav-next').href = 'pavillon cueno_aldo rossi/pavillon.html';

  // transition between project pages: interface stays put, only the
  // 3D model itself slides/scales like a character-select screen
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('viewer-canvas').classList.remove('model-transition-in');
  }));
  document.querySelectorAll('.nav-arrow').forEach((link) => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const url = link.href;
      document.getElementById('viewer-canvas').classList.add('model-transition-out');
      setTimeout(() => { window.location.href = url; }, 800);
    });
  });
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
  import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
  import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';

  const container = document.getElementById('viewer-canvas');

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, stencil: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.localClippingEnabled = true;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(52, container.clientWidth / container.clientHeight, 0.1, 1000);
  camera.position.set(4.5, 3, 6);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 2;
  controls.maxDistance = 200;
  controls.target.set(0, 0.6, 0);
  controls.update();

  const edgeResolutionTargets = [];

  // outline via post-processing (robust on hard edges/sharp corners,
  // unlike the inflated-normal-shell method which breaks at 90° corners)
  // — needs an explicit stencil buffer, or the section-cut fill (which
  // relies on the stencil test) draws across its full oversized plane
  const composerTarget = new THREE.WebGLRenderTarget(container.clientWidth, container.clientHeight, {
    stencilBuffer: true,
    samples: 4,
  });
  const composer = new EffectComposer(renderer, composerTarget);
  composer.addPass(new RenderPass(scene, camera));
  const outlinePass = new OutlinePass(
    new THREE.Vector2(container.clientWidth, container.clientHeight),
    scene, camera
  );
  outlinePass.edgeStrength = 5;
  outlinePass.edgeGlow = 0;
  outlinePass.edgeThickness = 1.3;
  outlinePass.visibleEdgeColor.set(0x1a1712);
  outlinePass.hiddenEdgeColor.set(0x1a1712);
  outlinePass.overlayMaterial.blending = THREE.CustomBlending;
  outlinePass.overlayMaterial.blendSrc = THREE.SrcAlphaFactor;
  outlinePass.overlayMaterial.blendDst = THREE.OneMinusSrcAlphaFactor;
  composer.addPass(outlinePass);
  composer.addPass(new OutputPass());

  const keyLight = new THREE.DirectionalLight(0xfff2e0, 3.4);
  keyLight.position.set(5, 8, 3);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -6;
  keyLight.shadow.camera.right = 6;
  keyLight.shadow.camera.top = 6;
  keyLight.shadow.camera.bottom = -6;
  keyLight.shadow.bias = -0.0005;
  scene.add(keyLight);

  const fillLight = new THREE.HemisphereLight(0x5fc7e3, 0x1b1a18, 0.28);
  scene.add(fillLight);

  // clip plane cuts front/back halves (normal along Z)
  const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
  let sectionView = false;
  let sectionMeshes = [];
  let sectionCap = null;
  let innerEdges = null;

  function buildSectionCap(meshes, plane, size, color) {
    const group = new THREE.Group();

    const geometries = meshes.map((mesh) => {
      const g = mesh.geometry.clone();
      g.applyMatrix4(mesh.matrixWorld);
      return g;
    });
    const geometry = mergeGeometries(geometries, false);

    const baseMat = new THREE.MeshBasicMaterial();
    baseMat.depthWrite = false;
    baseMat.depthTest = false;
    baseMat.colorWrite = false;
    baseMat.stencilWrite = true;
    baseMat.stencilFunc = THREE.AlwaysStencilFunc;

    const backMat = baseMat.clone();
    backMat.side = THREE.BackSide;
    backMat.clippingPlanes = [plane];
    backMat.stencilFail = THREE.IncrementWrapStencilOp;
    backMat.stencilZFail = THREE.IncrementWrapStencilOp;
    backMat.stencilZPass = THREE.IncrementWrapStencilOp;
    const backMesh = new THREE.Mesh(geometry, backMat);
    backMesh.renderOrder = 1;
    group.add(backMesh);

    const frontMat = baseMat.clone();
    frontMat.side = THREE.FrontSide;
    frontMat.clippingPlanes = [plane];
    frontMat.stencilFail = THREE.DecrementWrapStencilOp;
    frontMat.stencilZFail = THREE.DecrementWrapStencilOp;
    frontMat.stencilZPass = THREE.DecrementWrapStencilOp;
    const frontMesh = new THREE.Mesh(geometry, frontMat);
    frontMesh.renderOrder = 1;
    group.add(frontMesh);

    const capMat = new THREE.MeshStandardMaterial({
      color,
      roughness: 0.85,
      metalness: 0,
      side: THREE.DoubleSide,
      stencilWrite: true,
      stencilRef: 0,
      stencilFunc: THREE.NotEqualStencilFunc,
      stencilFail: THREE.ReplaceStencilOp,
      stencilZFail: THREE.ReplaceStencilOp,
      stencilZPass: THREE.ReplaceStencilOp,
    });
    const capPlane = new THREE.Mesh(new THREE.PlaneGeometry(size, size), capMat);
    capPlane.renderOrder = 2;
    plane.coplanarPoint(capPlane.position);
    capPlane.lookAt(
      capPlane.position.x - plane.normal.x,
      capPlane.position.y - plane.normal.y,
      capPlane.position.z - plane.normal.z
    );
    capPlane.onAfterRender = function (r) { r.clearStencil(); };
    group.add(capPlane);

    return group;
  }

  // smooth camera transitions between preset views
  let viewDistance = 8;
  let viewEyeY = 1;
  let flying = false;
  let flightStart = 0;
  const flightDuration = 700;
  const flightFrom = new THREE.Vector3();
  const flightFromTarget = new THREE.Vector3();
  const flightTo = new THREE.Vector3();
  const flightToTarget = new THREE.Vector3();

  function easeInOutQuad(t){ return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  function flyTo(position, target){
    flightFrom.copy(camera.position);
    flightFromTarget.copy(controls.target);
    flightTo.copy(position);
    flightToTarget.copy(target);
    flightStart = performance.now();
    flying = true;
  }

  const VIEW_PRESETS = {
    north: () => flyTo(new THREE.Vector3(viewDistance, viewEyeY, 0), new THREE.Vector3(0, viewEyeY, 0)),
    south: () => flyTo(new THREE.Vector3(-viewDistance, viewEyeY, 0), new THREE.Vector3(0, viewEyeY, 0)),
    east:  () => flyTo(new THREE.Vector3(0, viewEyeY, viewDistance), new THREE.Vector3(0, viewEyeY, 0)),
    west:  () => flyTo(new THREE.Vector3(0, viewEyeY, -viewDistance), new THREE.Vector3(0, viewEyeY, 0)),
  };

  document.querySelectorAll('[data-view]').forEach((btn) => {
    btn.addEventListener('click', () => VIEW_PRESETS[btn.dataset.view]());
  });

  // material presets to compare — click a swatch to preview live
  const MATERIAL_PRESETS = {
    platre: { color: [0.62, 0.60, 0.55], roughness: 0.85, metalness: 0 },
    beton:  { color: [0.42, 0.42, 0.40], roughness: 0.75, metalness: 0 },
    blanc:  { color: [0.85, 0.84, 0.80], roughness: 0.6,  metalness: 0 },
    terre:  { color: [0.55, 0.38, 0.32], roughness: 0.7,  metalness: 0 },
    bronze: { color: [0.35, 0.28, 0.18], roughness: 0.35, metalness: 0.5 },
  };
  function applyMaterialPreset(name){
    const p = MATERIAL_PRESETS[name];
    if (!p || !sectionMeshes.length) return;
    sectionMeshes.forEach((mesh) => {
      mesh.material.color.setRGB(p.color[0], p.color[1], p.color[2]);
      mesh.material.roughness = p.roughness;
      mesh.material.metalness = p.metalness;
    });
  }
  document.querySelectorAll('.swatch').forEach((btn) => {
    btn.addEventListener('click', () => {
      applyMaterialPreset(btn.dataset.preset);
      document.querySelectorAll('.swatch').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const cutToggle = document.getElementById('cut-toggle');
  cutToggle.addEventListener('click', () => {
    sectionView = !sectionView;
    const planes = sectionView ? [clipPlane] : [];
    sectionMeshes.forEach((mesh) => { mesh.material.clippingPlanes = planes; });
    if (innerEdges) innerEdges.material.clippingPlanes = planes;
    // OutlinePass's silhouette doesn't reliably track the clip plane, so
    // it's hidden during the cut — the interior edges (which do respect
    // clipping) plus the fill still read fine on their own
    outlinePass.enabled = !sectionView;
    if (sectionCap) sectionCap.visible = sectionView;
    cutToggle.classList.toggle('active', sectionView);
  });

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(400, 400),
    new THREE.ShadowMaterial({ opacity: 0.35 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const loader = new GLTFLoader();
  loader.load('tupi.glb', (gltf) => {
    const model = gltf.scene;

    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        child.material.color.setRGB(0.735, 0.72, 0.675);
        child.material.roughness = 0.725;
        child.material.metalness = 0;
        child.material.envMapIntensity = 0.4;
        child.material.clipShadows = true;
        child.material.shadowSide = THREE.DoubleSide;
      }
    });

    const box = new THREE.Box3().setFromObject(model);
    const center = new THREE.Vector3();
    box.getCenter(center);
    model.position.x -= center.x;
    model.position.z -= center.z;
    model.position.y -= box.min.y;

    scene.add(model);

    // fit camera to the model's actual size (bounding sphere, so framing
    // stays consistent regardless of each building's proportions)
    const fitBox = new THREE.Box3().setFromObject(model);
    const sphere = new THREE.Sphere();
    fitBox.getBoundingSphere(sphere);
    const fov = camera.fov * (Math.PI / 180);
    const distance = (sphere.radius / Math.sin(fov / 2)) * 1.5;
    const maxDim = sphere.radius * 2;

    const dir = new THREE.Vector3(-1.5, 1.3, 0.55).normalize();
    camera.position.copy(dir.multiplyScalar(distance)).add(sphere.center);
    camera.near = distance / 100;
    camera.far = distance * 100;
    camera.updateProjectionMatrix();

    controls.target.copy(sphere.center);
    controls.minDistance = distance * 0.25;
    controls.maxDistance = distance * 3;
    controls.update();

    viewDistance = distance;
    viewEyeY = sphere.center.y;

    keyLight.position.set(maxDim * 0.8, maxDim * 1.4, maxDim * 0.5);
    keyLight.shadow.camera.left = -maxDim;
    keyLight.shadow.camera.right = maxDim;
    keyLight.shadow.camera.top = maxDim;
    keyLight.shadow.camera.bottom = -maxDim;
    keyLight.shadow.camera.updateProjectionMatrix();

    model.updateMatrixWorld(true);
    sectionMeshes = [];
    model.traverse((child) => { if (child.isMesh) sectionMeshes.push(child); });
    sectionCap = buildSectionCap(sectionMeshes, clipPlane, maxDim * 2.2, 0xb4864f);
    sectionCap.visible = false;
    scene.add(sectionCap);

    outlinePass.selectedObjects = [model];

    // interior edge lines (creases), with a real on-screen pixel width
    // (fat lines) — merged + welded so seams between parts don't show up
    const edgeGeoms = sectionMeshes.map((mesh) => {
      const g = mesh.geometry.clone();
      g.applyMatrix4(mesh.matrixWorld);
      return g;
    });
    const weldedForEdges = mergeVertices(mergeGeometries(edgeGeoms, false), 1e-3);
    const edgesGeom = new THREE.EdgesGeometry(weldedForEdges, 20);
    const fatEdgesGeom = new LineSegmentsGeometry().fromEdgesGeometry(edgesGeom);
    innerEdges = new LineSegments2(
      fatEdgesGeom,
      new LineMaterial({ color: 0x1a1712, linewidth: 1.3, worldUnits: false })
    );
    innerEdges.material.resolution.set(container.clientWidth, container.clientHeight);
    scene.add(innerEdges);
    edgeResolutionTargets.push(innerEdges.material);
  });

  window.addEventListener('resize', () => {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
    composer.setSize(container.clientWidth, container.clientHeight);
    edgeResolutionTargets.forEach((mat) => mat.resolution.set(container.clientWidth, container.clientHeight));
  });

  (function animate() {
    requestAnimationFrame(animate);
    if (flying) {
      const t = Math.min((performance.now() - flightStart) / flightDuration, 1);
      const e = easeInOutQuad(t);
      camera.position.lerpVectors(flightFrom, flightTo, e);
      controls.target.lerpVectors(flightFromTarget, flightToTarget, e);
      if (t >= 1) flying = false;
    }
    controls.update();
    composer.render();
  })();
</script>

</body>
</html>
